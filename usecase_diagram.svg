<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Feature Flag &amp; Dynamic Config Manager — Use Case Diagram</text>

  <!-- System boundary -->
  <rect x="230" y="55" width="580" height="620" rx="8" fill="#f7f9fc" stroke="#333" stroke-width="2"/>
  <text x="520" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Feature Flag &amp; Dynamic Config Manager System</text>

  <!-- Actor: Release Manager (left) -->
  <g stroke="#111" stroke-width="2" fill="none">
    <circle cx="90" cy="330" r="14" fill="#fff"/>
    <line x1="90" y1="344" x2="90" y2="395"/>
    <line x1="60" y1="365" x2="120" y2="365"/>
    <line x1="90" y1="395" x2="65" y2="430"/>
    <line x1="90" y1="395" x2="115" y2="430"/>
  </g>
  <text x="90" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Release Manager</text>

  <!-- Actor: Software Engineer (right) -->
  <g stroke="#111" stroke-width="2" fill="none">
    <circle cx="910" cy="330" r="14" fill="#fff"/>
    <line x1="910" y1="344" x2="910" y2="395"/>
    <line x1="880" y1="365" x2="940" y2="365"/>
    <line x1="910" y1="395" x2="885" y2="430"/>
    <line x1="910" y1="395" x2="935" y2="430"/>
  </g>
  <text x="910" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Software Engineer</text>

  <!-- Use case ovals -->
  <g fill="#eaf1ff" stroke="#2a5db0" stroke-width="1.8">
    <ellipse cx="520" cy="110" rx="140" ry="30"/>
    <ellipse cx="520" cy="185" rx="140" ry="30"/>
    <ellipse cx="520" cy="260" rx="140" ry="30"/>
    <ellipse cx="520" cy="335" rx="140" ry="30"/>
    <ellipse cx="520" cy="410" rx="140" ry="30"/>
    <ellipse cx="520" cy="485" rx="140" ry="30"/>
  </g>
  <g font-size="13" fill="#111" text-anchor="middle">
    <text x="520" y="106">Create / Update</text>
    <text x="520" y="121">Feature Flag</text>
    <text x="520" y="181">Configure Percentage</text>
    <text x="520" y="196">Rollout</text>
    <text x="520" y="256">Set Environment</text>
    <text x="520" y="271">Override</text>
    <text x="520" y="331">Evaluate Feature</text>
    <text x="520" y="346">Flag</text>
    <text x="520" y="406">Sync Client SDK</text>
    <text x="520" y="485">View Audit Log</text>
  </g>

  <!-- Small use cases: Authenticate (include target) and Apply Beta Cohort (extend source) -->
  <ellipse cx="370" cy="590" rx="110" ry="28" fill="#fff4e0" stroke="#b0752a" stroke-width="1.8"/>
  <text x="370" y="595" text-anchor="middle" font-size="12" fill="#111">Authenticate Request</text>

  <ellipse cx="670" cy="590" rx="130" ry="28" fill="#eafbea" stroke="#2a8f4d" stroke-width="1.8"/>
  <text x="670" y="595" text-anchor="middle" font-size="12" fill="#111">Apply Beta Cohort Targeting</text>

  <!-- Actor associations: Release Manager -->
  <g stroke="#555" stroke-width="1.4">
    <line x1="118" y1="335" x2="380" y2="115"/>
    <line x1="118" y1="340" x2="380" y2="190"/>
    <line x1="118" y1="345" x2="380" y2="262"/>
    <line x1="118" y1="355" x2="380" y2="480"/>
  </g>

  <!-- Actor associations: Software Engineer -->
  <g stroke="#555" stroke-width="1.4">
    <line x1="882" y1="335" x2="660" y2="337"/>
    <line x1="882" y1="345" x2="660" y2="408"/>
  </g>

  <!-- Include relationships (dashed, arrow to Authenticate), routed left of the use-case column -->
  <g stroke="#b0752a" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow)">
    <path d="M400,128 C300,220 265,420 355,568"/>
    <path d="M400,278 C310,340 280,440 360,570"/>
    <path d="M405,502 C370,530 365,545 370,560"/>
  </g>
  <text x="265" y="330" font-size="12" fill="#8a5a1c">&#171;include&#187;</text>
  <text x="255" y="450" font-size="12" fill="#8a5a1c">&#171;include&#187;</text>
  <text x="380" y="545" font-size="12" fill="#8a5a1c">&#171;include&#187;</text>

  <!-- Extend relationship (dashed, arrow to Evaluate Feature Flag) -->
  <g stroke="#2a8f4d" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow)">
    <path d="M640,564 C610,480 580,410 560,360"/>
  </g>
  <text x="600" y="470" font-size="12" fill="#1e6b38">&#171;extend&#187;</text>

  <!-- Legend -->
  <g font-size="12" fill="#333">
    <rect x="60" y="620" width="150" height="80" fill="#fff" stroke="#999" stroke-width="1"/>
    <text x="70" y="638" font-weight="bold">Legend</text>
    <line x1="70" y1="650" x2="100" y2="650" stroke="#333" stroke-width="1.4"/>
    <text x="106" y="654">Association</text>
    <line x1="70" y1="668" x2="100" y2="668" stroke="#b0752a" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="106" y="672">&#171;include&#187;</text>
    <line x1="70" y1="686" x2="100" y2="686" stroke="#2a8f4d" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="106" y="690">&#171;extend&#187;</text>
  </g>
</svg>
